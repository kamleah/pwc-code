{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="error-container">
                <div class="icon">
                    <i class="fas fa-lock"></i>
                </div>
                <div class="card p-5 bg-light text-center shadow-sm">
                    <div class="card-body">
                        <h5 class="error-message text-orange">We cannot seem to find what you're looking for.</h5>
                        <p class="text-muted mb-4">Please contact your administrator for assistance.</p>
                        <a href="/" class="home-link btn btn-orange rounded-pill">Return to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Font Awesome for icons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<style>
    .error-container {
        text-align: center;
        position: relative;
        z-index: 2;
    }

    .error-message {
        font-size: 2rem;
        color: #212529;
        margin-bottom: 2rem;
    }

    .home-link {
        padding: 0.75rem 2rem;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .home-link:hover {
        transform: translateY(-3px);
        box-shadow: 0 7px 14px rgba(0, 0, 0, 0.1);
    }

    .shape {
        position: absolute;
        opacity: 0.05;
        border-radius: 50%;
    }

    .shape-1 {
        width: 400px;
        height: 400px;
        background-color: #fd7e14;
        top: -100px;
        left: -100px;
    }

    .shape-2 {
        width: 300px;
        height: 300px;
        background-color: #6610f2;
        bottom: -50px;
        right: -50px;
    }

    .shape-3 {
        width: 200px;
        height: 200px;
        background-color: #0dcaf0;
        top: 50%;
        right: 10%;
    }

    .icon {
        font-size: 3rem;
        color: #fd7e14;
        margin-bottom: 1rem;
    }

    .card {
        border: none;
        border-radius: 15px;
    }

    .text-orange {
        color: #fd7e14;
    }
</style>
{% endblock %}
